<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
.cp{max-width:1200px;margin:0 auto;padding:20px}
.cp .msg{border-radius:10px;padding:9px 14px;margin:0 0 12px;font-size:13.5px;line-height:1.5;background:var(--warn-bg);color:var(--warn);font-weight:600}
.cp .card{padding:16px 18px}
.cp .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cp h2{margin:0;font-size:19px}
.cp h3{font-size:15px;margin:18px 0 6px}
.pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.pick select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel);max-width:100%}
.pick label{display:inline-flex;gap:5px;align-items:center;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}
.tile b{display:block;font-size:22px}
.tile .ab{display:block;font-size:12.5px;color:var(--muted)}
.small{font-size:12.5px}
.muted{color:var(--muted)}
.grids{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:8px}
.grids>div{min-width:0}
.tt{border:1px solid var(--line);border-radius:10px;overflow:auto;background:var(--panel);margin-top:4px}
.tt table{border-collapse:collapse;width:100%;min-width:380px}
.tt th,.tt td{border:1px solid var(--line);padding:4px 3px;text-align:center;font-size:12px;overflow-wrap:anywhere}
.tt th{background:var(--chip)}
.tt th.p{white-space:nowrap;font-weight:500;color:var(--muted)}
.tt td.free{color:#b6bfcc}
.tt td.bd{background:#e3effd}
.tt.mark td.ch{outline:2px solid #e08a1e;outline-offset:-2px;background:#fff4e2;font-weight:600}
.tt.mark td.bd.ch{background:#fbe8cc}
.difflist{padding-left:20px;margin:6px 0}
.difflist li{margin:4px 0;overflow-wrap:anywhere}
.nodiff{color:var(--ok);font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts a{text-decoration:none}
@media (max-width:760px){.grids{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.cp{padding:12px 16px}.cp .card{padding:12px}.pick select{flex:1 1 150px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">⇄</span><div><div class="title">Compare</div><div class="sub">Two timetables of step 8, side by side.</div></div></div>
  <div class="top-actions">
    <a class="ghost filebtn" href="/home">Home</a>
    <a class="ghost filebtn" href="/logout">Sign out</a>
  </div>
</header>
<main class="cp">
  <div id="msg" role="status"></div>
  <div class="card" id="card"><p class="muted">Loading…</p></div>
</main>
<script src="/static/compare.js"></script>
</body>
</html>
