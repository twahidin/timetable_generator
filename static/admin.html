<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People and access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
.ad{max-width:1180px;margin:0 auto;padding:20px}
.ad .msg{border-radius:10px;padding:9px 14px;margin:0 0 12px;font-size:13.5px;line-height:1.5}
.ad .msg.ok{background:var(--ok-bg);color:var(--ok)}
.ad .msg.bad{background:var(--warn-bg);color:var(--warn);font-weight:600}
.ad .msg a{color:inherit}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 12px}
.tabs button,.tabs a{padding:6px 12px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);text-decoration:none;font-size:14px}
.tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(30,50,90,.12)}
.tabs a:hover{background:rgba(255,255,255,.6)}
.hint{background:#fff7e0;border:1px solid #f0d58a;border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:13px;line-height:1.5;color:#5c3d00}
.hint button{border:0;background:transparent;color:var(--accent);font-weight:600;padding:0 2px;box-shadow:none}
.hint button:hover:not(:disabled){box-shadow:none;text-decoration:underline}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.filters input[type=search]{min-width:180px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#1b2330;color:#fff;border-radius:10px;padding:8px 12px;margin:0 0 8px}
.bar button{background:#2b3546;border-color:#3b475b;color:#fff}
.bar button.on{background:#3b4a63;border-color:#6b82a8}
.bar button.clr{margin-left:auto;background:transparent;border-color:transparent;color:#c7cfdb}
.bar button.warn{color:#ffb4ab}
.menu{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 22px rgba(30,50,90,.14);padding:12px;margin:0 0 10px;max-width:640px}
.menu .it{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:5px 0}
.menu .sum{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.5}
.menu .sum p{margin:0 0 4px}
.menu .sum.bad{color:var(--warn);font-weight:600}
.menu .go{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.wrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
.wrap.nopanel{grid-template-columns:minmax(0,1fr)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tw table{min-width:560px}
.tw td{padding:7px 8px;font-size:13px;vertical-align:top}
.tw th{position:static}
.tw tr.sel td{background:#eaf1fe}
.tw tr.off td{color:#9aa4b2}
.tw tr.off .g{opacity:.6}
.tw td.ck,.tw th.ck{width:30px}
.linkbtn{border:0;background:transparent;padding:0;color:inherit;text-align:left;font-weight:600;box-shadow:none;border-radius:4px}
.linkbtn:hover:not(:disabled){box-shadow:none;text-decoration:underline}
.g{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.g.committee{background:#e4ddfb;color:#4b2ea8}.g.leader,.g.hod,.g.sh{background:#dbeafe;color:#1d4ed8}.g.teacher{background:#e7f6ec;color:#1e6b3a}.g.executive{background:#eceff3;color:#475163}
.x{display:inline-block;padding:1px 6px;border-radius:6px;font-size:11.5px;background:#fdf0dc;color:#7a4b00;margin:1px 3px 1px 0}
.w{color:var(--muted);font-size:12px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.side h2{margin:0 0 2px;font-size:16px}
.side .sub{color:var(--muted);font-size:12.5px;margin-bottom:6px}
.side .r{margin:12px 0}
.side .l{font-size:12px;color:var(--muted);margin-bottom:3px}
.side .ck2{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}
.side .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.side .once{margin-top:12px;background:#eef6ff;border:1px solid #bcd3fb;border-radius:8px;padding:10px;font-size:13px;line-height:1.5}
.side .once code{display:block;font-size:17px;letter-spacing:.08em;font-weight:700;margin:4px 0;word-break:break-all}
.add{margin-top:14px}
.add .row{margin-top:6px}
.ways td{vertical-align:top;font-size:13px}
.ways .on{color:var(--ok)}.ways .stillon{color:#7a4b00}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}.bar button.clr{margin-left:0}}
@media (max-width:640px){.ad{padding:12px}.filters input[type=search],.filters select{flex:1 1 140px}}
/* roles and committees apart, Edit on every row, the panel in view */
.ad .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ad .linkbtn{color:var(--accent);cursor:pointer;white-space:nowrap}
.ad .c{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11.5px;font-weight:600;margin:1px 3px 1px 0;white-space:nowrap}
.ad .c.timetable{background:#e4ddfb;color:#4b2ea8}.ad .c.relief{background:#dff3f1;color:#0b6b62}.ad .c.exams{background:#fdf0dc;color:#7a4b00}.ad .c.admin{background:#1b2330;color:#fff}
.ad .you{font-size:11px;color:var(--muted);font-weight:500;margin-left:4px}
.tw td{vertical-align:middle}
.tw td .w{white-space:nowrap}
.tw td.ed,.tw th.ed{position:sticky;right:0;width:1%;white-space:nowrap;text-align:right;padding-right:10px;z-index:1}
.tw td.ed{background:var(--panel)}
.tw th.ed{background:#f3f6fb}
.tw tr.sel td.ed{background:#eaf1fe}
#panel{position:sticky;top:76px}
#panel h2:focus{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.side .depts{display:flex;flex-wrap:wrap;gap:2px 14px}
.side .depts .ck2{margin:2px 0}
.side .ck2 .w{margin-left:2px}
.side .ck2 input:disabled+span,.side .ck2 input:disabled{opacity:.55}
.side .can{background:#f3f6fb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.55}
.side .can ul{margin:2px 0 0 16px;padding:0}
.side .can .mark{font-weight:700;color:#4b2ea8;margin-right:3px}
.side .rm{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px}
.side .rm .ask{background:var(--warn-bg);border-radius:8px;padding:8px 10px;color:var(--warn);font-weight:600;margin-bottom:6px;line-height:1.5}
@media (min-width:901px){#panel .side{max-height:calc(100vh - 92px);overflow:auto}}
@media (max-width:900px){#panel{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:rgba(27,35,48,.35)}#panel:empty{display:none}#panel .side{width:min(420px,100%);height:100%;overflow:auto;border-radius:0;box-shadow:0 10px 40px rgba(30,50,90,.35)}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">⇄</span><div><div class="title">People and access</div><div class="sub">Who can do what, and the ways in.</div></div></div>
  <div class="top-actions">
    <a class="ghost filebtn" href="/home">Home</a>
    <a class="ghost filebtn" href="/logout">Sign out</a>
  </div>
</header>
<main class="ad">
  <div id="msg" role="status"></div>
  <div id="moved"></div>
  <nav class="tabs" id="tabs" aria-label="Admin sections"></nav>
  <div id="view"><p class="muted">Loading…</p></div>
</main>
<script src="/static/adminview.js"></script>
<script src="/static/admin.js"></script>
</body>
</html>
