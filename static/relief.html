<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
.relief{max-width:820px;margin:0 auto;padding:20px}
.relief.wide{max-width:1180px}
.relief [hidden]{display:none!important}   /* hidden wins over the display rules below (the tabs while loading, bars) */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.relief .who{margin:0 0 10px}
.relief h2{margin:0 0 14px}
nav.rtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
nav.rtabs button{background:var(--glass);font-weight:500}
nav.rtabs button .n,nav.rtabs button.on .n{background:var(--warn);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;font-weight:700}
nav.rtabs button .n:empty{display:none}
.field{margin:0 0 18px}
.flabel{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;padding:7px 14px;box-shadow:none}
.seg button:last-child{border-right:0}
.seg button:hover:not(:disabled){background:rgba(37,99,235,.07);box-shadow:none}
.seg button.on,.seg button.on:hover:not(:disabled){background:var(--navy);color:#fff}
.under{margin-top:6px}
.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.line input[type=date]{min-width:150px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.dchip{display:inline-flex;align-items:center;gap:2px;padding:3px 3px 3px 10px;font-size:13px}
.dchip button,.rf-file button{border:0;background:transparent;padding:0 6px;border-radius:999px;line-height:1.5;color:var(--muted);box-shadow:none}
.dchip button:hover:not(:disabled),.rf-file button:hover:not(:disabled){background:rgba(27,35,48,.08);color:var(--warn);box-shadow:none}
.reason-line{margin-top:8px;width:100%;max-width:440px}
/* a lesson, with its work */
.rl{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--panel)}
.rf-head{display:flex;justify-content:space-between;gap:4px 14px;flex-wrap:wrap;align-items:baseline}
.rf-date{font-weight:700;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.rf-date:first-child{margin-top:0}
.rf-work{margin-top:8px;display:grid;gap:6px}
.rf-work input[type=url]{width:100%}
.rf-files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rf-file{display:inline-flex;align-items:center;gap:4px;padding:3px 3px 3px 10px;font-size:12.5px;white-space:normal}
.rf-file a{color:var(--accent)}
.rf-err{font-size:12.5px;color:var(--warn)}
.rf-err.say{color:var(--muted)}
.rf-err:empty{display:none}
.rf-shared{margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rf-none{margin:0}
/* Pick dates: two months side by side (relief-dates.js) */
.rd-cal{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;margin-top:10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.rd-month{flex:0 0 292px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px}
.rd-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:600;font-size:14.5px;margin-bottom:6px;min-height:28px}
.rd-arrow,.rd-gap{flex:none;width:30px;height:28px}
.rd-arrow{padding:0;border-radius:8px;color:var(--navy);font-size:15px;line-height:1}
.rd-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;touch-action:none}   /* a finger drags across the days rather than scrolls */
.rd-dow{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:2px 0 4px}
.rd-d{height:34px;min-width:0;padding:0;border:1px solid transparent;border-radius:8px;background:var(--panel);color:var(--ink);font-size:14px;box-shadow:none;transition:none}
.rd-d:hover:not(.off){border-color:#9db4cf;box-shadow:none}
.rd-d:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rd-d.off{background:#f0f1f4;color:#b3b9c3;cursor:not-allowed}
.rd-d.off:hover{border-color:transparent;box-shadow:none}
.rd-d.hol{background:repeating-linear-gradient(135deg,#f0f1f4 0 5px,#e6e8ed 5px 10px)}
.rd-d.today{border-color:var(--navy);font-weight:700}
.rd-d.pick{background:var(--navy);color:#fff}
.rd-d.add{background:#cfe0f3;color:var(--ink)}
.rd-d.rem{background:#f6d9d6;color:#8c2b20;text-decoration:line-through}
.rd-sum{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;min-height:30px}
.rd-sum b{font-weight:600}
.rd-full{font-size:12.5px;color:#9a5b00}
.rd-note{margin:8px 0 0}
/* the person picker */
.picker{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px;max-width:440px}
.picker .row{flex-wrap:nowrap}
.picker input{flex:1;min-width:0}
.picker ul{list-style:none;margin:6px 0 0;padding:0;max-height:240px;overflow:auto}
.picker li button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px;box-shadow:none}
.picker li button:hover:not(:disabled),.picker li button.first{background:rgba(37,99,235,.08);box-shadow:none}
.picker li .muted{font-size:12px;white-space:nowrap}
.picker .none{padding:6px 8px}
.pp-chosen{font-size:13px;padding:4px 12px}
/* sending and saving */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.bar .grow{flex:1}
.msg{font-size:13px}
.msg.bad{color:var(--warn);font-weight:600}
.msg.ok{color:var(--ok);font-weight:600}
.msg a{color:var(--accent)}
/* My absences */
.ab-top{display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;align-items:flex-start}
.ab-sub{margin:2px 0 12px}
.ab.cancelled .rl{background:#f7f8fa}
.chip.st-ok{background:var(--ok-bg);color:var(--ok)}
.chip.st-warn{background:var(--warn-bg);color:var(--warn)}
.chip.st-off{background:#eef0f3;color:var(--muted);white-space:normal}
.ab-changed{margin-top:6px;font-size:12.5px;color:#7a4b00;background:#fff7e6;border:1px solid #f3d9a4;border-radius:6px;padding:4px 8px}
.ab-nn{margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ab-ask{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ab-ask label{width:100%;font-size:12.5px}
.ab-ask input{flex:1 1 220px}
.ab-work{white-space:pre-wrap;margin-top:6px}
.ab-link{margin-top:4px;word-break:break-all}
.ab-link a,.ab-files a{color:var(--accent)}
.ab-files{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ab-nn-btn{margin-left:auto}
.ab-ask .q{width:100%;font-size:12.5px}
/* Link Telegram, at the top of My absences */
.tg h2{margin:0 0 8px}
.tg h2:focus{outline:none}
.tg-line{margin:0 0 8px;overflow-wrap:anywhere}
.tg-line:empty{margin:0}
.tg-open{margin:14px 0}
.tg-open a{display:inline-block}
.tg .bar{margin-top:0}
.tg .bar+.bar{margin-top:8px}
.tg-code{user-select:all;-webkit-user-select:all;font-size:15px;letter-spacing:.04em;white-space:nowrap}
.chip.st-amber{background:#fff4e0;color:#9a5b00}
.chip.new{background:#e6efff;color:#1d4ed8;font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.pl-changed{color:#7a4b00}
/* Plan relief: a chosen relief teacher and the "free then" list */
.pl-chosen{display:inline-flex;align-items:center;gap:2px;padding:2px 3px 2px 10px;font-size:12.5px;white-space:normal}
.pl-chosen button{border:0;background:transparent;padding:0 6px;border-radius:999px;line-height:1.5;color:inherit;box-shadow:none}
.pl-chosen button:hover:not(:disabled){background:rgba(27,35,48,.08);color:var(--warn);box-shadow:none}
.pl-msg{margin:8px 0 0}
.pl-list{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.pl-list .tier{font-size:11.5px;font-weight:700;color:var(--navy);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:4px 12px;align-items:center;padding:6px 8px;border-radius:8px}
.cand:nth-child(even){background:#fafbfc}
.cand.dim>:not(button){opacity:.55}
.cand.on{background:var(--ok-bg)}
.cand-n{white-space:nowrap}
.fat{display:inline-block;background:#f1eafb;color:#6b3fa0;border-radius:4px;padding:0 6px;font-size:11px;font-weight:600;white-space:nowrap}
.why{font-size:12px;color:var(--muted)}
.mark{display:inline-block;font-size:11.5px;color:#9a5b00;background:#fff4e0;border-radius:4px;padding:0 5px}
.pl-teaching{margin:4px 0 0;color:var(--muted)}
.pl-foot{margin-top:8px}
.linkish{border:0;background:transparent;padding:0;color:var(--accent);text-decoration:underline;box-shadow:none;font:inherit;border-radius:0}
.linkish:hover:not(:disabled){box-shadow:none;background:transparent;border:0}
.pl-dl{margin:0 0 14px}
.pl-dl .line{margin-top:0}
/* Planned by me and What's in */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.rtable td{padding:8px;vertical-align:top}
table.rtable td.act{text-align:right;white-space:nowrap}
table.rtable tr.off td{opacity:.62}
table.rtable tr.new td{background:#f3f8ff}
table.inbox{min-width:860px}
/* Today (the relief team) */
.td-acts{justify-content:flex-end}
.td-acts.tg{margin-bottom:12px}   /* only while a bot is connected: Remind all's place is then kept under the buttons */
.td-acts [data-td="remind-all"],.td-gap{margin-right:14px}
.td-gap{visibility:hidden;border:1px solid transparent;padding:7px 12px}   /* Remind all's place when it is not there, as large as the button */
.td-day{margin:0 0 12px}
.td-counts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.counter{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--panel);min-width:112px}
.counter b{font-size:20px;line-height:1.2}
.counter.amber b{color:#9a5b00}.counter.ok b{color:var(--ok)}.counter.blue b{color:#1d4ed8}.counter.bad b{color:var(--warn)}
.td-top{margin:0 0 8px}
.td-list{border-top:1px solid var(--line)}
.td-row{display:grid;grid-template-columns:92px minmax(0,1.3fr) minmax(0,2fr) minmax(0,1.3fr);gap:6px 14px;padding:10px 6px;border-bottom:1px solid var(--line);align-items:start}
.td-row.td-cols{font-size:12px;font-weight:600;color:var(--muted);padding:6px}
.td-row.off>:not(.td-under){opacity:.62}
.td-row.ask{background:#fffaf0}
.td-under{grid-column:1 / -1}
.td-under .pl-list{margin-top:4px}
.td-relief .why{margin-top:2px}
.td-by{display:inline-block;font-size:11px;font-weight:700;color:#1d4ed8;background:#e6efff;border-radius:4px;padding:0 5px}
.td-warn{font-size:12.5px;color:var(--warn);margin-top:4px}
.td-busy{color:var(--navy);font-style:italic}
/* Load (the relief team) */
.ld-filters{margin:0 0 10px}
.ld-filters select{max-width:100%}
.ld-dept{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.ld-table .linkish{text-align:left}
table.ld-table{min-width:640px}
table.rtable th.num,table.rtable td.num{text-align:right;white-space:nowrap}
.ld-one{margin-top:14px}
.ld-one h3{margin:0 0 2px}
tr.ld-wait td{background:#fffaf0}
/* Weekly summary (the relief team) */
.sm .ab-top{margin-bottom:12px}
.sm-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sm-nav h2{margin:0}
.sm-nav h2:focus{outline:none}
.sm-facts{margin:0 0 4px;display:grid;gap:4px}
.sm-facts>div{display:flex;gap:2px 10px;flex-wrap:wrap}
.sm-facts dt{flex:0 0 130px;color:var(--muted)}
.sm-facts dd,.sm-bars dd{margin:0;min-width:0}
.sm-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:0 28px}
.sm-bars{margin:0;display:grid;gap:5px}
.sm-bars>div{display:grid;grid-template-columns:9em minmax(0,1fr);gap:10px;align-items:center}
.sm-bars.days>div{grid-template-columns:2.6em minmax(0,1fr)}
.sm-bars dt{overflow-wrap:anywhere}
.sm-bars dd{display:flex;align-items:center;gap:10px}
.sm-bar{flex:1;min-width:0;height:10px;border-radius:999px;background:var(--chip);overflow:hidden}
.sm-bar i{display:block;height:100%;background:var(--navy)}
.sm-bars b{min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.sm-top{margin:0}
table.sm-table{min-width:620px}
.sm-date{white-space:nowrap}
.td-new{margin-top:6px}
.td-yes{color:var(--ok)}.td-no{color:var(--warn)}
.chip.td-chip{white-space:normal;display:inline-block}
.chip.st-sent{background:#eef4fb;color:var(--navy)}
.chip.st-blue{background:#e6efff;color:#1d4ed8}
.td-btns{margin-top:6px;gap:6px}
.td-split{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.td-split>span{width:100%}
/* Reliefs I'm covering */
.cv-work{margin-top:6px}
.cv-asked{margin-top:8px;color:#1d4ed8}
.cv.cv-past{background:#f7f8fa}
.cv:focus{outline:2px solid rgba(37,99,235,.35);outline-offset:2px}
@media (max-width:760px){.td-row{grid-template-columns:64px minmax(0,1fr)}.td-row>.td-relief,.td-row>.td-state{grid-column:1 / -1}.td-row.td-cols{display:none}
  .td-acts{justify-content:flex-start}}
@media (max-width:640px){.relief{padding:12px}.rd-cal{flex-direction:column}.rd-month{flex:none;width:100%;max-width:360px}.seg{display:flex}.seg button{flex:1 1 auto;padding:7px 8px}.bar .grow{display:none}
  .cand{grid-template-columns:auto auto minmax(0,1fr)}.cand .cand-who{grid-column:1 / -1}.cand button,.cand .chip{justify-self:end}
  .counter{min-width:0;flex:1 1 40%}.td-day .seg{flex:1 1 100%}.sm-facts{gap:8px}.sm-facts>div{display:block}
  .td-acts [data-td="remind-all"]{order:1;margin-right:0}.td-gap{display:none}}   /* Remind all last: it comes and goes under the others, with no empty line */
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">⇄</span><div><div class="title" id="title">Relief</div><div class="sub">Ask for relief, plan relief and see the reliefs you cover.</div></div></div>
  <div class="top-actions">
    <a class="ghost filebtn" id="ttLink" href="/timetable">Your timetable</a>
    <a class="ghost filebtn" id="settingsLink" href="/relief/settings" hidden>Relief settings</a>
    <a class="ghost filebtn" href="/logout">Sign out</a>
  </div>
</header>
<main class="relief" id="main">
  <p class="muted small who" id="who" hidden></p>
  <nav class="tabs rtabs" id="tabs" role="tablist" aria-label="Relief" hidden>
    <button type="button" role="tab" id="tab-mine" data-tab="mine" aria-controls="pane-mine" hidden>My absences<span class="n" id="mineN"></span></button>
    <button type="button" role="tab" id="tab-ask" data-tab="ask" aria-controls="pane-ask" hidden>Ask for relief</button>
    <button type="button" role="tab" id="tab-covering" data-tab="covering" aria-controls="pane-covering" hidden>Reliefs I'm covering</button>
    <button type="button" role="tab" id="tab-plan" data-tab="plan" aria-controls="pane-plan" hidden>Plan relief</button>
    <button type="button" role="tab" id="tab-inbox" data-tab="inbox" aria-controls="pane-inbox" hidden>What's in</button>
    <button type="button" role="tab" id="tab-today" data-tab="today" aria-controls="pane-today" hidden>Today</button>
    <button type="button" role="tab" id="tab-load" data-tab="load" aria-controls="pane-load" hidden>Load</button>
    <button type="button" role="tab" id="tab-summary" data-tab="summary" aria-controls="pane-summary" hidden>Weekly summary</button>
  </nav>
  <div id="loading" class="card"><p class="muted">Loading…</p></div>
  <section class="pane" id="pane-mine" role="tabpanel" aria-labelledby="tab-mine" hidden></section>
  <section class="pane" id="pane-ask" role="tabpanel" aria-labelledby="tab-ask" hidden></section>
  <section class="pane" id="pane-covering" role="tabpanel" aria-labelledby="tab-covering" hidden></section>
  <section class="pane" id="pane-plan" role="tabpanel" aria-labelledby="tab-plan" hidden></section>
  <section class="pane" id="pane-inbox" role="tabpanel" aria-labelledby="tab-inbox" hidden></section>
  <section class="pane" id="pane-today" role="tabpanel" aria-labelledby="tab-today" hidden></section>
  <section class="pane" id="pane-load" role="tabpanel" aria-labelledby="tab-load" hidden></section>
  <section class="pane" id="pane-summary" role="tabpanel" aria-labelledby="tab-summary" hidden></section>
</main>
<script src="/static/relief-form.js"></script>
<script src="/static/relief-dates.js"></script>
<script src="/static/relief.js"></script>
<script src="/static/relief-telegram.js"></script>
<script src="/static/relief-plan.js"></script>
<script src="/static/relief-inbox.js"></script>
<script src="/static/relief-today.js"></script>
<script src="/static/relief-load.js"></script>
<script src="/static/relief-summary.js"></script>
<script src="/static/relief-covering.js"></script>
</body>
</html>
